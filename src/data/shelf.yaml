# The Shelf: books, films and music, cited Chicago-style on /shelf.
#
# Fields:
#   id        unique, lowercase-with-dashes
#   medium    book | film | music
#   title     exact title (italicised automatically)
#   creator   "Last, First" for people (author, director, artist); bands as written ("The Microphones")
#   year      original publication / release year
#   note      optional: one line in your own words
#   current   optional: true puts it in the home page "Currently" line (one per medium)
#
# Entries are sorted alphabetically by creator on the page, like a bibliography.

